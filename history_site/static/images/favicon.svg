<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Фон с древней книгой/свитком -->
  <defs>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Основной круг -->
  <circle cx="100" cy="100" r="95" fill="url(#brownGrad)" stroke="#5c4033" stroke-width="2"/>
  
  <!-- Древняя книга -->
  <rect x="45" y="65" width="110" height="70" fill="#d4a574" stroke="#5c4033" stroke-width="2" rx="8"/>
  
  <!-- Страницы книги -->
  <line x1="100" y1="65" x2="100" y2="135" stroke="#5c4033" stroke-width="1.5"/>
  <path d="M 55 75 Q 100 75 145 75" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <path d="M 55 85 Q 100 85 145 85" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <path d="M 55 95 Q 95 95 135 95" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <path d="M 55 105 Q 100 105 145 105" stroke="#f4d03f" stroke-width="2" fill="none"/>
  <path d="M 55 115 Q 95 115 140 115" stroke="#f4d03f" stroke-width="2" fill="none"/>
  
  <!-- Звездочка символа древней истории -->
  <polygon points="100,50 105,65 120,65 110,75 115,90 100,80 85,90 90,75 80,65 95,65" fill="#f4d03f"/>
</svg>